# Application
quarkus.http.port=8082
quarkus.application.name=order-service

# H2 Database
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:order;DB_CLOSE_DELAY=-1

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Inventory REST Client
quarkus.rest-client.inventory-api.url=http://localhost:8081

# REST Client Timeout
quarkus.rest-client.inventory-api.connect-timeout=1000
quarkus.rest-client.inventory-api.read-timeout=5000

# H2 Console
quarkus.h2.console.enabled=true
quarkus.h2.console.path=/h2-console


# Test Config
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:order_test_db;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.rest-client.inventory-api.url=http://localhost:8081
# Integration test
%test.quarkus.http.test-port=0